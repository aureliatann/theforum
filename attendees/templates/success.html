{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Registration Successful</title>
    <link rel="stylesheet" href="{% static 'attendees/css/style.css' %}">
    <link rel="icon" href="{% static 'attendees/images/favicon.ico' %}">
</head>
<body>

<!-- ====================
     SUCCESS CONTAINER
     ==================== -->
<div class="fade-enter" id="page-container">
    <div class="container success-container">
        <!-- BANNER -->
        <div class="banner">
            <img src="{% static 'attendees/images/banner.jpg' %}" alt="The Forum 2026" class="banner-img">
        </div>

        <!-- SUCCESS MESSAGE -->
        <h2>Registration Successful</h2>
        <p>
            Thank you for registering for The Forum 2026. 
            An email with your ticket has been sent to 
            <strong>{{ attendee_email }}</strong>.
        </p>
        
        <!-- BACK BUTTON -->
        <div class="button-container">
            <a href="/register/" class="submit-btn">Register another attendee</a>
        </div>
    </div> 
</div>

<!-- ====================
     LOAD SCRIPT
     ==================== -->
<script>
// DOMContentLoaded: function runs ONLY after the HTML is fully loaded
// Ensures all elements exist before JavaScript tries to access them
document.addEventListener("DOMContentLoaded", function() {
    const page = document.getElementById("page-container");
    
    // setTimeout(): delays actual submission for animation to finish
    setTimeout(() => page.classList.add("fade-enter-active"), 50);
});
</script>

</body>
</html>
